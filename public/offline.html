<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>No connection — MacroSync</title>
    <!--
      Standalone on purpose: this page is served by the service worker when the
      network is gone, so it can't fetch a stylesheet or a font. Everything it
      needs is inline, and the colours are copied from the two themes in
      index.css rather than imported.
    -->
    <style>
      :root {
        color-scheme: light;
        --page: #f8fafc;
        --card: #ffffff;
        --line: #e2e8f0;
        --ink: #0f172a;
        --muted: #64748b;
        --brand: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #0b1220;
          --card: #151d2c;
          --line: #273347;
          --ink: #f2f6fb;
          --muted: #9aa8bd;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .mark {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
        line-height: 1.3;
        letter-spacing: -0.2px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 12px 16px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#10b981" />
        <path
          d="M5.5 20.5c3 0 3.6-9 6.5-9s3.5 9 6.5 9 3-5 5-5"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <h1>You're offline</h1>
      <p>
        MacroSync needs a connection to load your diary and workouts. Anything you were part-way
        through is still saved on the server.
      </p>

      <button type="button" onclick="location.reload()">Try again</button>
    </main>

    <script>
      // Reload the moment the connection returns, so nobody is left staring at
      // this page after their signal comes back.
      addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
