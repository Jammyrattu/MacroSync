# Supabase CLI project config.
# `project_id` is a local label; `supabase link --project-ref <ref>` is what
# binds this directory to the hosted project.
project_id = "macrosync"

[functions.food-search]
# Keep JWT verification on: supabase-js attaches the signed-in user's token
# automatically, so only authenticated users can spend our Open Food Facts
# rate limit.
verify_jwt = true

[functions.gif-search]
# Same reasoning as above — the GIPHY key is metered, so the proxy stays behind
# auth rather than being an open endpoint anyone can point at our quota.
verify_jwt = true

[functions.admin-delete-user]
# The function re-checks the caller's admin role against user_roles itself, but
# verification here means an unauthenticated request never reaches that code.
verify_jwt = true

[functions.health-oauth-start]
verify_jwt = true

[functions.health-sync]
verify_jwt = true

[functions.health-disconnect]
verify_jwt = true

[functions.health-oauth-callback]
# The ONE exception. Google redirects the user's browser here straight from the
# consent screen with no session attached, so a JWT can never be present.
# Authorisation rests on the single-use `state` row written by
# health-oauth-start, which is consumed before the code is exchanged.
verify_jwt = false
